<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公益职业规划周 · 预约登记表</title>
<style>
  @page { size: A4; margin: 15mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #222; background: #f5f5f5; padding: 20px; }
  .page { max-width: 210mm; margin: 0 auto; background: #fff; padding: 30mm 25mm; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
  h1 { text-align: center; font-size: 22pt; margin-bottom: 4pt; letter-spacing: 2pt; }
  .subtitle { text-align: center; color: #666; font-size: 12pt; margin-bottom: 24pt; border-bottom: 2px solid #222; padding-bottom: 12pt; }
  .info-row { display: flex; gap: 16pt; margin-bottom: 20pt; }
  .info-row .field { flex: 1; }
  .info-row .field label { font-size: 10pt; color: #666; display: block; margin-bottom: 4pt; }
  .info-row .field .line { border-bottom: 1px solid #222; padding: 4pt 0; min-height: 22pt; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 20pt; }
  th, td { border: 1px solid #222; padding: 6pt 8pt; text-align: center; font-size: 10pt; }
  th { background: #f0f0f0; font-weight: 600; }
  td { height: 28pt; }
  .time-col { width: 22%; font-weight: 500; }
  .sign-col { width: 16%; }
  .slot-note { text-align: center; margin-top: 12pt; font-size: 10pt; color: #888; }
  .footer { margin-top: 24pt; display: flex; justify-content: space-between; font-size: 10pt; color: #666; }
  @media print {
    body { background: #fff; padding: 0; }
    .page { box-shadow: none; padding: 0; max-width: 100%; }
    .no-print { display: none !important; }
  }
  .no-print { text-align: center; margin-bottom: 16pt; }
  .no-print button { background: #7c3aed; color: #fff; border: none; border-radius: 8pt; padding: 10pt 24pt; font-size: 12pt; cursor: pointer; }
  .no-print button:hover { background: #6d28d9; }
</style>
</head>
<body>

<div class="no-print">
  <button onclick="window.print()">🖨️ 打印登记表</button>
  <p style="margin-top:8pt;color:#888;font-size:10pt">打印后可以手写登记，或复印多份使用</p>
</div>

<div class="page">

  <div class="info-row">

  <table>

        <th>6月30日（周二）</th>
        <th>7月1日（周三）</th>
        <th>7月2日（周四）</th>

      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="time-col">09:00 – 09:50</td>
        <td></td><td></td><td></td><td></td><td></td>
      </tr>
      <tr>
        <td class="time-col">10:00 – 10:50</td>

      </tr>
      <tr>
        <td class="time-col">11:00 – 11:50</td>
        <td></td><td></td><td></td><td></td><td></td>
      </tr>
      <tr>

      </tr>
      <tr>
        <td class="time-col">15:00 – 15:50</td>
        <td></td><td></td><td></td><td></td><td></td>
      </tr>
      <tr>
        <td class="time-col">16:00 – 16:50</td>
        <td></td><td></td><td></td><td></td><td></td>
      </tr>
    </tbody>
  </table>

  <p class="slot-note">* 每位同学约 50 分钟，请提前 5 分钟到达</p>

  <div class="footer">
    <span>咨询师签名：__________________</span>
    <span>打印日期：____________________</span>
  </div>
</div>

</body>
</html>
