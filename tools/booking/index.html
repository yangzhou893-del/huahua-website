  .footer { margin-top: 20pt; display: flex; justify-content: space-between; font-size: 10pt; color: #666; }
  @media print {
    body { background: #fff; padding: 0; }
    .page { box-shadow: none; padding: 0; max-width: 100%; }
    .no-print { display: none !important; }
  }

  .no-print button:hover { background: #6d28d9; }
</style>
</head>
